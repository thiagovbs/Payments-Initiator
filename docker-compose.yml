services:
  app:
    build: .
    container_name: payment-initiator
    restart: unless-stopped
    # Carrega as variáveis do .env local (INITIATOR_CLIENT_SECRET, CORE_BASE_URL,
    # CALLBACK_URL, etc.).
    env_file:
      - .env
    environment:
      PORT: "8100"
    volumes:
      # Persiste apenas os dados (consentimentos e dispositivos vinculados).
      # Montar o volume em /app sombreava o codigo e o virtualenv da imagem: a
      # partir da segunda subida o container rodava a versao antiga, porque o
      # volume ja existia e tinha precedencia sobre o conteudo da imagem.
      - initiator-data:/app/data
    ports:
      - "3200:8100"
    networks:
      - default

volumes:
  initiator-data:

networks:
  default:
    driver: bridge
