services:
  app:
    build: .
    container_name: payment-initiator
    restart: unless-stopped
    # Carrega as variáveis do .env local (INITIATOR_CLIENT_SECRET, CORE_BASE_URL,
    # CALLBACK_URL, etc.).
    env_file:
      - .env
    environment:
      PORT: "8100"
    volumes:
      # Persiste o banco SQLite (consentimentos e dispositivos vinculados).
      # O engine cria o arquivo initiator.db no diretório de trabalho (/app).
      - initiator-data:/app
    ports:
      - "3200:8100"
    networks:
      - default

volumes:
  initiator-data:

networks:
  default:
    driver: bridge
