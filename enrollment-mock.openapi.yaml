openapi: 3.0.3
info:
  title: Enrollment ITP-JSR v2 - Mock (Criação)
  description: >
    Mock da API de Enrollment (vínculo de dispositivo) da Jornada Sem Redirecionamento
    (JSR). Recebe apenas os dados mínimos de cadastro de um dispositivo e retorna um
    enrollmentId gerado dinamicamente, simulando a criação do vínculo.
  version: 1.0.0
  contact:
    name: Sensedia Open Finance
servers:
  - url: https://<gateway>/open-banking/itp
    description: Mock na plataforma Sensedia
tags:
  - name: Enrollment
    description: Operações de vínculo de dispositivo (JSR) - Mock
paths:
  /v2/enrollments:
    post:
      tags:
        - Enrollment
      summary: Criar intenção de vínculo (enrollment) - Mock
      operationId: criarEnrollmentMock
      description: >
        Mock do POST /v2/enrollments. Recebe os dados mínimos de cadastro de um
        dispositivo (CPF, nome do dispositivo, conta, limites de transação e fidoUser)
        e retorna um enrollmentId gerado dinamicamente, como se o enrollment tivesse
        sido criado.
      parameters:
        - $ref: '#/components/parameters/XIdempotencyKey'
        - $ref: '#/components/parameters/XFapiInteractionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentMinimalRequest'
            examples:
              exemplo_minimo:
                summary: Exemplo mínimo de cadastro de dispositivo
                value:
                  loggedUser:
                    document:
                      identification: "11111111111"
                      rel: CPF
                  debtorAccount:
                    ispb: "D4C3B2A1"
                    issuer: "3344"
                    number: "405060"
                    accountType: CACC
                  enrollmentName: Nome Dispositivo
                  data:
                    transactionLimit: "40.00"
                    dailyLimit: "40.00"
                    fidoUser:
                      name: Doce de Mocoto
                      displayName: Dez anos
      responses:
        '200':
          description: Enrollment criado (mock) - retorna enrollmentId gerado
          headers:
            x-itp-enrollment-id:
              description: ID do enrollment gerado (mock)
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEnrollmentMockResponse'
              examples:
                exemplo_resposta:
                  summary: Resposta simulada de criação
                  value:
                    enrollmentId: 3f2a1b4c-9d8e-4f6a-b7c2-1a2b3c4d5e6f
                    status: ENROLLMENT_AUTHORISED
                    enrollmentName: Nome Dispositivo
                    loggedUser:
                      document:
                        identification: "11111111111"
                        rel: CPF
                    debtorAccount:
                      ispb: "D4C3B2A1"
                      issuer: "3344"
                      number: "405060"
                      accountType: CACC
                    data:
                      transactionLimit: "40.00"
                      dailyLimit: "40.00"
                      fidoUser:
                        name: Doce de Mocoto
                        displayName: Dez anos
                    redirect_uri: https://<gateway>/open-banking/itp/v2/enrollments/3f2a1b4c-9d8e-4f6a-b7c2-1a2b3c4d5e6f/authorize?requestId=7c8d9e0f-1a2b-3c4d-5e6f-7a8b9c0d1e2f
                    requestId: 7c8d9e0f-1a2b-3c4d-5e6f-7a8b9c0d1e2f
                    journey:
                      isLinked: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  parameters:
    XIdempotencyKey:
      name: x-idempotency-key
      in: header
      required: false
      description: Chave de idempotência (UUID)
      schema:
        type: string
        format: uuid
    XFapiInteractionId:
      name: x-fapi-interaction-id
      in: header
      required: false
      description: ID de interação FAPI (UUID)
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Não autorizado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Entidade não processável (erro de negócio)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateEnrollmentMinimalRequest:
      type: object
      description: Dados mínimos de cadastro de um dispositivo para o mock
      required:
        - loggedUser
        - enrollmentName
      properties:
        loggedUser:
          $ref: '#/components/schemas/LoggedUser'
        debtorAccount:
          $ref: '#/components/schemas/DebtorAccount'
        enrollmentName:
          type: string
          description: Nome do dispositivo vinculado
          example: Nome Dispositivo
        data:
          $ref: '#/components/schemas/EnrollmentData'
    EnrollmentData:
      type: object
      description: Dados complementares do enrollment (limites e usuário FIDO)
      properties:
        transactionLimit:
          type: string
          description: Limite por transação
          example: "40.00"
        dailyLimit:
          type: string
          description: Limite diário
          example: "40.00"
        fidoUser:
          $ref: '#/components/schemas/FidoUser'
    LoggedUser:
      type: object
      required:
        - document
      properties:
        document:
          $ref: '#/components/schemas/Document'
    Document:
      type: object
      required:
        - identification
        - rel
      properties:
        identification:
          type: string
          description: Número do documento (CPF ou CNPJ)
          example: "11111111111"
        rel:
          type: string
          description: Tipo do documento
          enum:
            - CPF
            - CNPJ
    DebtorAccount:
      type: object
      properties:
        ispb:
          type: string
          description: ISPB da instituição
          example: "48703388"
        issuer:
          type: string
          description: Agência (branch code)
          example: "0001"
        number:
          type: string
          description: Número da conta
          example: "0000103251"
        accountType:
          type: string
          description: Tipo da conta
          enum:
            - CACC
            - SLRY
            - SVGS
            - TRAN
          example: CACC
    FidoUser:
      type: object
      description: Dados do usuário FIDO
      properties:
        name:
          type: string
          description: Nome do usuário FIDO
          example: Joao
        displayName:
          type: string
          description: Nome de exibição do usuário FIDO
          example: Joao da Silva
    CreateEnrollmentMockResponse:
      type: object
      description: Resposta simulada de criação do enrollment
      properties:
        enrollmentId:
          type: string
          format: uuid
          description: ID do enrollment gerado (mock)
        status:
          type: string
          enum:
            - AWAITING_RISK_SIGNALS
            - AWAITING_ACCOUNT_HOLDER_VALIDATION
            - AWAITING_ENROLMENT
            - ENROLLMENT_AUTHORISED
            - AUTHORISED
            - REJECTED
            - REVOKED
          example: ENROLLMENT_AUTHORISED
        enrollmentName:
          type: string
          description: Nome do dispositivo vinculado
        loggedUser:
          $ref: '#/components/schemas/LoggedUser'
        debtorAccount:
          $ref: '#/components/schemas/DebtorAccount'
        data:
          $ref: '#/components/schemas/EnrollmentData'
        redirect_uri:
          type: string
          format: uri
          description: URL simulada para redirecionar à detentora
        requestId:
          type: string
          format: uuid
          description: ID da requisição (mock)
        journey:
          type: object
          properties:
            isLinked:
              type: boolean
              example: false
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              title:
                type: string
              detail:
                type: string
